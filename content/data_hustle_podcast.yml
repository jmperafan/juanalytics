- url: https://www.youtube.com/watch?v=PfQ3Ao5oIU8
  title: "Scaling a Data Consultancy: Pricing, Branding & Clients - #13 David Cohen"
  date: 2026-09-25
  podcast: The Data Hustle Podcast
  episode: "13"
  description: |-
    Most data consultants are great at the technical work and bad at everything that turns it into a business.

    In this episode of The Data Hustle, we speak with David Cohen, founder of Superposition, a consultancy for data and AI consultancy founders, about what it actually takes to build and scale a boutique consultancy: positioning, pricing, go-to-market, hiring, discovery and scoping.

    David explains why most founders come to him after brute-forcing their way to a ceiling, why consultancies are bad at marketing and lose the attention game, and why his first piece of advice is simply to take more risks and be less boring. We get into pricing in depth: why hourly billing is easy but does not scale, how fixed, retainer and value-based models let you control margin, why the work costs what it costs regardless of where your team sits, and who ends up bearing the risk when a client's Terraform admin disappears for three weeks.

    We also discuss why a generic "we build insights and AI solutions" message reaches nobody, how to define an ideal customer profile and the personas inside it, how to qualify and say no to prospects, why it is okay to fire a client, and why a founder's first responsibility is to their team rather than to the client.

    Finally, David walks us through the white-labelled, gamified discovery workshops he runs for consultancies: getting the actual decision makers into one room, letting stakeholders fight it out early, and turning ambiguous client conversations into scoped work people actually buy.

    Find David:

    LinkedIn: https://www.linkedin.com/in/davcohen06/
    Superposition: https://www.superpositionstrat.com/
    Newsletter: https://superpositionstrat.beehiiv.com
    YouTube: https://www.youtube.com/@Superpositionstrat
