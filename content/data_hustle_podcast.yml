- url: https://www.youtube.com/watch?v=gPkikwFjJ0k
  title: "AI Won't Fix Your Culture: Power Distance, Vibe Coding & Human Judgment - #15 Jimmy Pang"
  date: 2026-10-07
  podcast: The Data Hustle Podcast
  episode: "15"
  description: |-
    Your data architecture ends up looking like your company's culture, whether you planned it or not.

    In this episode of The Data Hustle, we speak with Jimmy Pang, founder of Data Biz and former data and analytics leader at Foodpanda, Delivery Hero, HelloFresh and Vestiaire Collective, about building data teams across Hong Kong, Berlin and Paris, and what eight years of doing that teaches you about culture, AI and data mesh.

    Jimmy starts with payments and fraud at Foodpanda, where cash on delivery and bot attacks turned a finance topic into a data problem, then walks through how German, Chinese and French working cultures differ: meeting notes, power distance, work-life balance, and why a federal country like Germany produced a data landscape with eleven ways to answer one question while Hong Kong defaulted to a central model. His conclusion is that culture is the first thing to assess before any data or tech change.

    We then move to the economics: why Jimmy thinks the future of data work is in Asia, why AI is the next bookkeeper-to-finance-team productivity leap rather than the end of the profession, and the difference between an Apple approach and a Google approach to shipping with AI, including the comprehension debt you take on when the model does the thinking for you. On communication, he takes the Culture Map as his guide and keeps everything explicit: one-on-ones, written retrospectives, and a documented way of working that survives a two-city team.

    Finally, Juan and Jimmy dig into data mesh: why it is a big-company problem, why German companies can agree on the principle and fail on execution, what monolithic repos, Impala and two-hour CI runs did to his day, and why you should take data mesh as a principle, never word for word.

    Find Jimmy:

    LinkedIn: https://www.linkedin.com/in/jimmy-pang-hk603/
    Data Biz (Substack): https://jimmypang.substack.com/
