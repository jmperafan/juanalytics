- url: https://www.youtube.com/watch?v=TUL9wAh9KEk
  title: "Surviving the Mean Data Streets: Semantic Layers, Friction & Passion - #14 Chris Tabb"
  date: 2026-10-01
  podcast: The Data Hustle Podcast
  episode: "14"
  description: |-
    Thirty years in data and the same mistakes keep coming back with new names.

    In this episode of The Data Hustle, we speak with Chris Tabb, co-founder and Chief Commercial Officer of LEIT DATA and self-appointed mayor of the Mean Data Streets, about what three decades in BI, data and consulting teach you about the industry's habit of reinventing itself.

    Chris started in the back office at Cognos in the 1990s, went independent as a BI consultant in 1998, and has been hands-on through databases, ETL, BI and big data ever since. He explains why the semantic layer was born with Business Objects universes and Cognos catalogs, why "context layer" is his umbrella for graphs, ontologies, semantic layers and vector databases, and why the one-person modelling bottleneck that killed the old semantic layer is finally being automated away.

    We get honest about consulting as a lifestyle: why you should not go into it if you want a nine-to-five and your weekends, why passion is a hiring filter Chris can spot in minutes, and why the extra money on a day rate comes at a cost. Chris lays out his definition of business value as an evidenceable positive effect on company objectives, why ROI is a word he hates, and his three kinds of friction: delivery, business and operational.

    We also cover AI and scale: why rolling Claude out to every developer without structure produces piles of code nobody understands, why TOGAF-style architecture artefacts are suddenly worth maintaining again as the spine for agents, and how Chris ran a whole demo pipeline on a few cents of tokens.

    Finally, Chris walks through the journey from freelancer to founding LEIT DATA: picking a specialism (early Snowflake), running lean until you can afford the first hire, growing to a hundred people and back, HR and bench forecasting, what he looks for when hiring, and why community only works when you show up without an agenda.

    Find Chris:

    LinkedIn: https://www.linkedin.com/in/chris-tabb-datatips/
    LEIT DATA: https://www.leit-data.com/
  duration: 47:08
