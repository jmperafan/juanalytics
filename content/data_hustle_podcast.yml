- url: https://www.youtube.com/watch?v=djTLrlR2sSo
  title: "How Sequentum Scrapes the Web at Scale - #11 Data Hustle"
  date: 2026-08-14
  podcast: The Data Hustle Podcast
  episode: "11"
  description: |-
    AI is moving from generating answers to making decisions. That changes the stakes.

    In this episode of The Data Hustle, we speak with Sarah McKenna, CEO of Sequentum, about why AI needs the equivalent of seatbelts: clear guardrails, acceptance criteria, audit trails, deterministic workflows and accountable human review.

    Drawing on two decades across software test automation, DevOps, data quality and enterprise web extraction, Sarah explains why automation becomes fragile when teams optimise for speed without building in trust. We discuss reusable components, versioning, validation, low-code visibility, security reviews and the role of AI coding tools in maintaining large-scale data systems.

    We also zoom out to the growing conflict around the open web: publishers, AI crawlers, web-scraping companies, bot identification, paid data access and agentic commerce. Sarah explains why regulated organisations often reject AI at runtime, even while using it aggressively to accelerate development and strengthen governance.

    Find Sarah

    LinkedIn: https://www.linkedin.com/in/sarahransommckenna/
    Sequentum: https://www.sequentum.com/
  thumbnail: https://i.ytimg.com/vi/djTLrlR2sSo/maxresdefault.jpg
  tags: []
- url: https://www.youtube.com/watch?v=BbWfELhzQRU
  title: "Taking Analytics by Storm with Agents - #10 Data Hustle"
  date: 2026-08-07
  podcast: The Data Hustle Podcast
  episode: "10"
  description: |-
    AI agents promise to let anyone analyse company data through a conversation—but reliable agentic analytics requires far more than connecting an LLM to a database.

    In this episode of The Data Hustle, we speak with Claire Gouze and Christophe Blefari, co-founders of Nao, about building an open-source framework for agentic analytics. They explain how their experience in consulting and data leadership exposed a recurring problem: business teams want answers faster, while data teams remain trapped as overloaded bottlenecks.

    We discuss which parts of data work should be automated, why analytics engineers may evolve into context engineers, whether traditional dashboards are becoming obsolete, and why companies risk replacing their dashboard graveyards with agent cemeteries.

    Claire and Christophe also break down the role of semantic layers, metadata and reusable context; why teams should not wait for perfect foundations before experimenting; how Nao structures its analytics agent; and how data professionals can use AI to become more visible and valuable rather than automate themselves out of the process.

    Find Nao at:

    - https://getnao.io
    - https://github.com/getnao/nao
    - https://www.linkedin.com/in/claire-gouze/
    - https://www.linkedin.com/in/christopheblefari/
  thumbnail: https://i.ytimg.com/vi/BbWfELhzQRU/maxresdefault.jpg
