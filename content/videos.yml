  title: DE Zoomcamp 4.5.3 - dbt Packages
  date: 2026-01-18
  description: |-
    In this video, you'll discover the power of dbt packages - reusable dbt projects that extend your capabilities with pre-built macros, tests, and models. You'll learn about the most valuable community packages, how to find them on dbt Hub, and how to install and use them in your projects.

    🔗 Course materials: https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/04-analytics-engineering
    💬 Join the community: https://datatalks.club/slack

    What You'll Learn:
    - What dbt packages are and how they work like Python libraries
    - Essential packages: dbt utils for cross-database SQL functions
    - Codegen for automatic YAML file generation (huge time-saver!)
    - Audit helper for safe refactoring and model comparison
    - dbt expectations with pre-built tests for almost any scenario
    - How to install packages and integrate them into your project

    Timestamps:

    🔗 dbt Hub: https://hub.getdbt.com/
