  title: DE Zoomcamp 4.2.1 - dbt Core vs dbt Cloud
  date: 2026-01-18
  description: |-
    In this video, you'll understand the key differences between dbt Core and dbt Cloud, the evolution of dbt from an open-source tool to a comprehensive platform, and why this course focuses on dbt Core. You'll learn about dbt Fusion, the new engine rewriting dbt's future, and how to choose the right dbt setup for your needs.

    🔗 Course materials: https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/04-analytics-engineering
    💬 Join the community: https://datatalks.club/slack

    What You'll Learn:
    - The origins of dbt Core (2016) as a free, open-source command-line tool
    - How dbt Cloud emerged as a SaaS platform with managed infrastructure
    - The introduction of dbt Fusion and its impact on the dbt ecosystem
    - Adapter support considerations when choosing between Core and Cloud
    - Why this course uses dbt Core with DuckDB and how it translates to dbt Cloud

    Timestamps:

    🔗 dbt Core vs Cloud comparison: https://www.getdbt.com/product/dbt-core-vs-dbt-cloud
