    - Feature-specific commands: seed, snapshot, source freshness, and docs
    - Core workflow commands: compile, run, test, and the all-in-one dbt build
    - Essential flags: full-refresh, fail-fast, target switching, and model selection
    - Advanced selectors: upstream/downstream dependencies with + syntax
    - State-based workflows for CI/CD: detecting modified and new models

