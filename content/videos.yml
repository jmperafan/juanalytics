- url: https://www.youtube.com/watch?v=2dYDS4OQbT0
  title: DE Zoomcamp 4.3.1 - dbt Project Structure
  date: 2026-01-13
  description: |-
    In this tutorial, you'll learn the anatomy of a dbt project and understand the purpose of each directory and file created when you initialize dbt. By the end of this video, you'll know where to place different types of SQL logic, how to organize your transformations, and understand dbt's recommended project structure conventions.

    🔗 Course materials: https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/04-analytics-engineering
    💬 Join the community: https://datatalks.club/slack

    What You'll Learn:
    - Understanding the dbt_project.yml file and why it's critical for every dbt command
    - Using the analysis folder for data quality reports and administrative queries
    - Creating reusable logic with macros (similar to Python functions)
    - Working with seeds for quick CSV ingestion and lookup tables
    - Implementing snapshots to track slowly changing dimensions
    - Writing singular tests as SQL assertions
    - Organizing models into staging, intermediate, and marts layers

    Timestamps:
