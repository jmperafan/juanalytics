    - Installing DuckDB and dbt Core with the DuckDB adapter
    - Initializing a dbt project and understanding its structure
    - Configuring profiles.yaml for optimal performance with large datasets
    - Creating a local data lake and ingesting NYC taxi data into DuckDB
    - Setting up Git ignore best practices to avoid committing data
    - Installing and configuring the Power User for dbt VS Code extension

