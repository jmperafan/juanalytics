- url: https://www.youtube.com/watch?v=bvZ-rJm7uMU
  title: DE Zoomcamp 4.5.2 - dbt Tests
  date: 2026-01-16
  description: |-
    In this tutorial, you'll learn how to implement comprehensive testing strategies in dbt to ensure data quality and catch errors before they reach production. By the end of this video, you'll understand the different types of tests available in dbt, from basic generic tests to advanced unit tests and model contracts, and how to use them to build reliable data pipelines.

    🔗 Course materials: https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/04-analytics-engineering
    💬 Join the community: https://datatalks.club/slack

    What You'll Learn:
    - Understanding the two root causes of data quality issues (bad source data vs. SQL bugs)
    - Writing singular tests for custom business logic validation
    - Implementing source freshness tests to monitor data timeliness
    - Using dbt's four built-in generic tests (unique, not_null, accepted_values, relationships)
    - Creating custom generic tests for organization-specific validation rules
    - Building unit tests to defensively test complex SQL logic
    - Enforcing data contracts to validate data types and constraints

    Timestamps:
  duration: 8:29
  thumbnail: https://i.ytimg.com/vi/bvZ-rJm7uMU/maxresdefault.jpg
  tags:
