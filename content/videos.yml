  title: DE Zoomcamp 4.6.1 - dbt Commands
  date: 2026-01-18
  description: |-
    In this comprehensive video, you'll master all essential dbt commands and flags needed for daily analytics engineering work. You'll learn when to use each command, understand the powerful dbt build workflow, and discover how to efficiently work with specific models using selectors and state-based deployments.

    🔗 Course materials: https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/04-analytics-engineering
    💬 Join the community: https://datatalks.club/slack

