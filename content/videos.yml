- url: https://www.youtube.com/watch?v=7CrrXazV_8k
  title: DE Zoomcamp 4.3.2 - dbt Sources
  date: 2026-01-13
  description: |-
    In this tutorial, you'll learn how to configure dbt sources and create your first staging models. By the end of this video, you'll understand how to connect dbt to your raw data tables, use the source() function for dynamic references, and apply best practices for staging layer transformations including column renaming, data type casting, and proper naming conventions.

    🔗 Course materials: https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/04-analytics-engineering
    💬 Join the community: https://datatalks.club/slack

    What You'll Learn:
    - Creating a sources.yml file to define your raw data locations
    - Understanding database, schema, and table configurations for both DuckDB and BigQuery
    - Using the source() function instead of hard-coded table references
    - Implementing staging model naming conventions (stg_ prefix)
    - Organizing columns logically (IDs, timestamps, trip info, payment info)
    - Casting data types explicitly for consistency
    - Following the one-to-one staging principle (minimal transformations)

    Timestamps:
  duration: 18:15
  thumbnail: https://i.ytimg.com/vi/7CrrXazV_8k/maxresdefault.jpg
  tags:
    - dbt
    - Analytics Engineering
- url: https://www.youtube.com/watch?v=JQYz-8sl1aQ
  title: DE Zoomcamp 4.4.1 - dbt Models
  date: 2026-01-13
  description: |-
    In this tutorial, you'll learn how to build intermediate and mart models in dbt by exploring real-world data transformations. By the end of this video, you'll understand the difference between staging, intermediate, and mart layers, learn how to use the ref() function to build dependencies between models, and discover how to handle column discrepancies when combining datasets.

    🔗 Course materials: https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/04-analytics-engineering
    💬 Join the community: https://datatalks.club/slack

    What You'll Learn:
    - Transitioning from staging to business logic: exploring data and understanding context
    - Planning your mart layer: dashboards vs dimensional models (facts and dimensions)
    - Understanding dimensional modeling concepts (fact tables and dimension tables)
    - Using the ref() function to reference dbt models (vs source() for raw data)
    - Creating intermediate models for complex transformations like unions
    - Handling column discrepancies between similar datasets
    - Understanding the business context behind the NYC taxi data (yellow vs green taxis)
    - Adding default values for missing columns to enable unions

    Timestamps:
  duration: 13:07
  thumbnail: https://i.ytimg.com/vi/JQYz-8sl1aQ/maxresdefault.jpg
  tags:
    - dbt
    - Analytics Engineering
- url: https://www.youtube.com/watch?v=lT4fmTDEqVk
  title: DE Zoomcamp 4.4.2 - dbt Seeds and Macros
  date: 2026-01-13
  description: |-
    In this tutorial, you'll learn how to use dbt seeds to import lookup tables and create reusable logic with dbt macros. By the end of this video, you'll understand how to enrich dimensional data using CSV files, implement macros as SQL functions to maintain consistency, and apply these concepts to build proper dimension tables for your data warehouse.

    🔗 Course materials: https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/04-analytics-engineering
    💬 Join the community: https://datatalks.club/slack

    What You'll Learn:
    - Understanding the need for lookup tables (vendor names, location details)
    - Using dbt seeds to import CSV files into your data warehouse
    - Creating dimension tables from seed data (dim_zones)
    - Building macros to encapsulate reusable business logic
    - Using macros as SQL functions with parameters
    - Enriching dimension tables with descriptive attributes
    - Best practices for seeds: size limitations and security considerations

    Timestamps:
  duration: 12:06
  thumbnail: https://i.ytimg.com/vi/lT4fmTDEqVk/maxresdefault.jpg
  tags:
    - dbt
    - Analytics Engineering
- url: https://www.youtube.com/watch?v=UqoWyMjcqrA
  title: DE Zoomcamp 4.5.1 - Documentation
  date: 2026-01-13
  description: |-
    In this tutorial, you'll learn how to create comprehensive documentation for your dbt project using YAML files and dbt's built-in documentation features. By the end of this video, you'll understand how to document sources, models, and columns, add metadata tags for governance, and generate a visual lineage graph that shows how your data flows through transformations.

    🔗 Course materials: https://github.com/DataTalksClub/data-engineering-zoomcamp/tree/main/04-analytics-engineering
    💬 Join the community: https://datatalks.club/slack

    What You'll Learn:
    - Creating documentation in sources.yml and schema.yml files
    - Adding descriptions for tables and columns (single and multi-line)
    - Implementing metadata tags for governance (PII, ownership, importance)
    - Documenting models, macros, and seeds
    - Using dbt docs generate to create documentation JSON
    - Using dbt docs serve to view documentation locally (dbt Core)
    - Exploring the dbt documentation site: compiled SQL, lineage graphs, and dependencies
    - Understanding the difference between technical documentation and data catalogs

    Timestamps:
  duration: 8:30
